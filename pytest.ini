[pytest]
testpaths = tests
markers =
    cong_nghiep_vu: cổng chất lượng tuyệt đối theo yêu cầu nghiệp vụ (đang đỏ có chủ ý — model chưa đạt)
    dac-ta: kiểm thử theo đặc tả AC1/AC2/AC3
    ac: nhóm acceptance criteria
    ac1: AC1 happy path
    ac2: AC2 edge — cổng HITL
    ac3: AC3 negative — không bịa dữ liệu
    bien: ca phân tích giá trị biên
    cau-hinh: ca chứng minh tham số cấu hình được
    happy-path: luồng thuận
    edge: ca biên
    negative: ca nghịch
    rang-buoc-phap-ly: ràng buộc pháp lý, không có biên độ tha thứ
    ha-tang: ca phân biệt lỗi hạ tầng với lỗi model
    mat-trai: ca kiểm mặt trái của một quy tắc
    gioi-han: sổ giới hạn phép đo
    dieu-quan-tam-nhat: mục "ĐIỀU CHÚNG TÔI QUAN TÂM NHẤT" của đề
    tu-soi: ca bộ đo tự soi chính nó
addopts = -q -p no:cacheprovider

# Kỷ luật cho bộ test tự động:
#   xfail_strict  điểm kiểm gắn "lỗi đã biết" mà bỗng ĐẠT thì phải ĐỎ, bắt đóng lỗi
#                 và chốt lại data/nhan/loi_da_biet.json — không được im lặng trôi qua
#   filterwarnings  cảnh báo là lỗi, để thư viện đổi hành vi thì biết ngay
xfail_strict = true
filterwarnings =
    error::DeprecationWarning:bo_do.*
